name: Telegram Delivery

on:
  workflow_run:
    workflows:
      - Build and Release
    types:
      - completed

concurrency:
  group: android-app-updater-telegram-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-telegram:
    name: 📲 Send updated apps
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      API_ID: ${{ secrets.TELEGRAM_API_ID }}
      API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TAG: android-apps-${{ github.event.workflow_run.id }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # Setup
      # ─────────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🧰 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gh
          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            telethon \
            tgcrypto

      # ─────────────────────────────────────────────────────────────
      # Find release
      # ─────────────────────────────────────────────────────────────
      - name: ⏳ Wait for release to become available
        id: release
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for release: ${TAG}"

          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release is available."
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Release not available yet (attempt ${attempt}/30). Sleeping 10s..."
            sleep 10
          done

          echo "No release was created for this successful build. Nothing to send."
          echo "found=false" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────
      # Download release assets
      # ─────────────────────────────────────────────────────────────
      - name: 📥 Download release assets
        if: steps.release.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dl
          mkdir -p dl

          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*_v*.apk" \
            --pattern "*_v*.exe" \
            --pattern "captions.txt" \
            --dir dl

          shopt -s nullglob
          files=(dl/*.apk dl/*.exe)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Release contains no app files. Nothing to send."
            exit 0
          fi

          if [ -f dl/captions.txt ]; then
            cp dl/captions.txt captions.txt
          fi

          echo "Downloaded files:"
          printf ' - %s\n' "${files[@]}"

      # ─────────────────────────────────────────────────────────────
      # Telegram delivery
      # ─────────────────────────────────────────────────────────────
      - name: 📲 Upload apps to Telegram
        if: steps.release.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/upload.py
