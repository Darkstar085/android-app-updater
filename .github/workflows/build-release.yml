          rm -f captions.txt
          for apkfile in *_v*.apk *_v*.exe; do
            FILE=$(basename "$apkfile")
            APP="${FILE%%_v*}"
            EMOJI="${app_emoji[$APP]:-📦}"
            DESC="${app_desc[$APP]:-No description available}"
            NEW_VER=$(echo "$FILE" | sed -E 's/.*_v(.*)\.(apk|exe)/\1/')
            OLD_VER="${old_versions[$APP]:-}"
          
            if [ "$OLD_VER" = "$NEW_VER" ]; then
              continue
            fi
          
            if [ -z "$OLD_VER" ]; then
              VERSION="🆕 Version: $NEW_VER"
            else
              VERSION="🚀 Version: $OLD_VER → $NEW_VER"
            fi
          
            CHANGELOG="Changelog: <a href='${app_repo[$APP]}'>Open</a>"
          
            echo "📦 <b>File name</b> – ${FILE}
              ${EMOJI} ${DESC}
          ${VERSION}
          
          ${CHANGELOG}
              ----" >> captions.txt
          done
          echo "::endgroup::Generate captions.txt"
          echo "::group::Build release notes"
          declare -A old_versions
          if [ -f old-apk-versions.txt ]; then
            while IFS=: read -r app ver; do
              app="$(echo "$app" | xargs)"
              ver="$(echo "$ver" | xargs)"
              [ -z "$app" ] && continue
              old_versions["$app"]="$ver"
            done < old-apk-versions.txt
          fi
          
          declare -A new_versions
          for apk in *_v*.apk *_v*.exe; do
            APP="${apk%%_v*}"
            VER="$(echo "$apk" | sed -E 's/.*_v(.*)\.(apk|exe)/\1/')"
            new_versions["$APP"]="$VER"
          done
          
          NOTES=""
          for app in "${!new_versions[@]}"; do
            OLD="${old_versions[$app]}"
            NEW="${new_versions[$app]}"
            if [ -z "$OLD" ]; then
              NOTES+="$app: $NEW"$'\n'
            elif [ "$OLD" != "$NEW" ]; then
              NOTES+="$app: $OLD → $NEW"$'\n'
            fi
          done
          
          if [ -z "$NOTES" ]; then
            if ls *_v*.apk *_v*.exe 1>/dev/null 2>&1; then
              for apk in *_v*.apk *_v*.exe; do
                APP="${apk%%_v*}"
                VER="$(echo "$apk" | sed -E 's/.*_v(.*)\.(apk|exe)/\1/')"
                NOTES+="$APP: $VER"$'\n'
              done
            else
              NOTES="No app versions updated."
            fi
          fi
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo -e "${NOTES//\\n/$'\n'}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "::endgroup::Build release notes"
          echo "::group::Build release name (IST)"
          export TZ=Asia/Kolkata
          echo "REL_NAME=Prebuilts Update - $(date +'%Y-%m-%d %H:%M %Z')" >> $GITHUB_ENV
          echo "::endgroup::Build release name (IST)"
          echo "::group::Write latest versions"
          declare -A LATEST
          
          if [ -f latest-apk-versions.txt ]; then
            while IFS=: read -r app ver; do
              app=$(echo "$app" | xargs)
              ver=$(echo "$ver" | xargs)
              LATEST["$app"]="$ver"
            done < latest-apk-versions.txt
          fi
          
          for apk in *_v*.apk *_v*.exe; do
            APP="${apk%%_v*}"
            VER="$(echo "$apk" | sed -E 's/.*_v(.*)\.(apk|exe)/\1/')"
            LATEST["$APP"]="$VER"
          done
          
          for app in "${!LATEST[@]}"; do
            echo "$app: ${LATEST[$app]}"
          done | sort > latest-apk-versions.txt
          echo "::endgroup::Write latest versions"
      - name: Create release
        if: env.UPDATED_APPS != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: prebuilts-${{ github.run_id }}
          name: ${{ env.REL_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          files: |
            *_v*.apk
            *_v*.exe
            captions.txt
        env:
          GITHUB_TOKEN: ${{ env.ACCESS_TOKEN }}
      - name: Commit update summary
        if: env.UPDATED_APPS != ''
        env:
          GITHUB_TOKEN: ${{ env.ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          export TZ=Asia/Kolkata
          COMMIT_DATE="$(date +'%Y-%m-%d')"
          COMMIT_TIME="$(date +'%H:%M %Z')"

          declare -A OLD_VERSIONS
          if [ -f old-apk-versions.txt ]; then
            while IFS=: read -r app ver; do
              app="$(echo "$app" | xargs)"
              ver="$(echo "$ver" | xargs)"
              [ -z "$app" ] && continue
              OLD_VERSIONS["$app"]="$ver"
            done < old-apk-versions.txt
          fi

          UPDATE_LINES=""
          UPDATED_COUNT=0
          for file in *_v*.apk *_v*.exe; do
            [ -f "$file" ] || continue
            APP="${file%%_v*}"
            NEW_VER="$(echo "$file" | sed -E 's/.*_v(.*)\.(apk|exe)/\1/')"
            OLD_VER="${OLD_VERSIONS[$APP]:-}"

            if [ -n "$OLD_VER" ] && [ "$OLD_VER" != "$NEW_VER" ]; then
              UPDATE_LINES+="- $APP: $OLD_VER → $NEW_VER"$'\n'
            else
              UPDATE_LINES+="- $APP: $NEW_VER (new)"$'\n'
            fi
            UPDATED_COUNT=$((UPDATED_COUNT + 1))
          done

          COMMIT_BODY=$(cat <<EOF
          📦 Prebuilts Update

          📅 Date: ${COMMIT_DATE}
          🕐 Time: ${COMMIT_TIME}

          ✅ Updated apps (${UPDATED_COUNT}):
          ${UPDATE_LINES}
          📁 Updated files:
          - latest-apk-versions.txt
          - captions.txt

          🤖 Automated by GitHub Actions
          EOF
          )

          git add latest-apk-versions.txt captions.txt
          git commit -m "📦 Prebuilts Update — ${COMMIT_DATE} [skip ci]" -m "$COMMIT_BODY" || echo "No changes to commit"
          git push origin main
