name: Build and Release

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "*.txt"

  schedule:
    - cron: "30 4 * * 0"

concurrency:
  group: android-app-updater-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.TOKEN }}

jobs:
  build-release:
    name: 📦 Build & Release
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────────────────────
      # Setup
      # ─────────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧰 Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt gh jq

      - name: 🔎 Validate app configuration
        run: python3 .github/scripts/validate_apps.py

      # ─────────────────────────────────────────────────────────────
      # Scheduling
      # ─────────────────────────────────────────────────────────────
      - name: 📅 Weekly random-day gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          WEEK=$(date +%Y-%U)
          TODAY=$(date +%w)
          STORED_WEEK=""
          STORED_DAY=""

          if [[ -f .run_week ]]; then
            STORED_WEEK=$(cut -d: -f1 .run_week)
            STORED_DAY=$(cut -d: -f2 .run_week)
          fi

          if [[ "$STORED_WEEK" != "$WEEK" ]]; then
            STORED_DAY=$((RANDOM % 7))
            echo "$WEEK:$STORED_DAY" > .run_week
            echo "New random run day: $STORED_DAY"
          else
            echo "Using stored run day: $STORED_DAY"
          fi

          if [[ "$TODAY" != "$STORED_DAY" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the selected day. Nothing to do."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # ─────────────────────────────────────────────────────────────
      # Download + processing
      # ─────────────────────────────────────────────────────────────
      - name: 📦 Download & process all apps
        if: steps.gate.outputs.run == 'true'
        run: python3 .github/scripts/update_apps.py

      # ─────────────────────────────────────────────────────────────
      # Release metadata
      # ─────────────────────────────────────────────────────────────
      - name: 🧾 Prepare release metadata
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 .github/scripts/prepare_release.py

          echo ""
          echo "Updated apps: $UPDATED_COUNT"
          echo "Skipped: $SKIPPED_COUNT"
          echo "Download failures: $FAILED_COUNT"
          echo ""
          cat .update-results.json

      - name: ⏹️ Stop when there are no updates
        if: steps.gate.outputs.run == 'true' && env.HAS_UPDATES != 'true'
        run: echo "No new app versions. No release will be created."

      # ─────────────────────────────────────────────────────────────
      # GitHub Release
      # ─────────────────────────────────────────────────────────────
      - name: 🚀 Create GitHub Release
        if: steps.gate.outputs.run == 'true' && env.HAS_UPDATES == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-apps-${{ github.run_id }}
          name: 📦 Android Apps Update — ${{ env.REL_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          files: |
            *_v*.apk
            *_v*.exe
            captions.txt

      # ─────────────────────────────────────────────────────────────
      # Repository state
      # ─────────────────────────────────────────────────────────────
      - name: 📝 Commit update state
        if: steps.gate.outputs.run == 'true' && env.HAS_UPDATES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export TZ=Asia/Kolkata
          DATE=$(date +'%Y-%m-%d')
          TIME=$(date +'%H:%M IST')

          cat > commit-body.md <<EOF
          📦 Android App Updater

          📅 Date: $DATE
          🕐 Time: $TIME

          ✅ Updated apps ($UPDATED_COUNT):
          $UPDATED_LIST

          ⚠️ Download failures: $FAILED_COUNT
          ⏭️ Skipped/unchanged: $SKIPPED_COUNT

          🤖 Automated by GitHub Actions
          EOF

          git add latest-apk-versions.txt captions.txt .run_week
          git commit \
            -m "📦 Android Apps Update — $DATE [skip ci]" \
            -F commit-body.md \
            || echo "No state changes to commit"

          git push origin main
