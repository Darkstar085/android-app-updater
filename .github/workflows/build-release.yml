name: Build and Release

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "*.txt"

  schedule:
    - cron: "30 4 * * 0"

concurrency:
  group: android-app-updater-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.TOKEN }}

jobs:
  build-release:
    name: 📦 Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧰 Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt gh jq

      - name: 🔎 Validate app configuration
        run: python3 .github/scripts/validate_apps.py

      - name: 📅 Weekly random-day gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          WEEK=$(date +%Y-%U)
          TODAY=$(date +%w)
          STORED_WEEK=""
          STORED_DAY=""
          if [[ -f .run_week ]]; then
            STORED_WEEK=$(cut -d: -f1 .run_week)
            STORED_DAY=$(cut -d: -f2 .run_week)
          fi
          if [[ "$STORED_WEEK" != "$WEEK" ]]; then
            STORED_DAY=$((RANDOM % 7))
            echo "$WEEK:$STORED_DAY" > .run_week
            echo "New random run day: $STORED_DAY"
          else
            echo "Using stored run day: $STORED_DAY"
          fi
          if [[ "$TODAY" != "$STORED_DAY" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the selected day. Nothing to do."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Download & process all apps
        if: steps.gate.outputs.run == 'true'
        run: python3 .github/scripts/update_apps.py

      - name: 🧾 Prepare release metadata
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 .github/scripts/prepare_release.py
          echo ""
          echo "Updated apps: $UPDATED_COUNT"
          echo "Skipped: $SKIPPED_COUNT"
          echo "Download failures: $FAILED_COUNT"
          echo ""
          cat .update-results.json

      - name: ⏹️ Stop when there are no updates
        if: steps.gate.outputs.run == 'true' && env.HAS_UPDATES != 'true'
        run: echo "No new app versions. No release will be created."

      - name: 🚀 Create GitHub Release
        if: steps.gate.outputs.run == 'true' && env.HAS_UPDATES == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-apps-${{ github.run_id }}
          name: 📦 Android Apps Update — ${{ env.REL_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          files: |
            *_v*.apk
            *_v*.exe
            captions.txt

      - name: 📝 Save updater state
        if: ${{ always() && steps.gate.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .run_week

          # prepare_release.py cleans stale entries whenever the full updater runs.
          # Persist that cleanup even when no app versions changed.
          if [[ "${{ steps.gate.outputs.run }}" == "true" ]]; then
            git add latest-apk-versions.txt
          fi

          if [[ "${{ steps.gate.outputs.run }}" == "true" && "${HAS_UPDATES:-false}" == "true" ]]; then
            git add captions.txt
          fi

          if git diff --cached --quiet; then
            echo "No updater state changes to commit."
            exit 0
          fi

          export TZ=Asia/Kolkata
          DATE=$(date +'%Y-%m-%d')
          TIME=$(date +'%H:%M IST')

          if [[ "${HAS_UPDATES:-false}" == "true" ]]; then
            printf '📦 Android App Updater\n\n📅 Date: %s\n🕐 Time: %s\n\n' "$DATE" "$TIME" > commit-body.md
            printf '✅ Updated apps (%s):\n%s\n\n' "$UPDATED_COUNT" "$UPDATED_LIST" >> commit-body.md
          else
            printf '📦 Android App Updater\n\n📅 Date: %s\n🕐 Time: %s\n\n📅 Saved the weekly random-day schedule and cleaned version state.\n\n' "$DATE" "$TIME" > commit-body.md
          fi

          printf '⚠️ Download failures: %s\n⏭️ Skipped/unchanged: %s\n\n🤖 Automated by GitHub Actions\n\nSigned-off-by: S I P U N <sipunkumar85@gmail.com>\n' "${FAILED_COUNT:-0}" "${SKIPPED_COUNT:-0}" >> commit-body.md
          git commit -F commit-body.md
          git push origin main
